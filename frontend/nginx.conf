# Mismo esquema que vercel.json en producción: /api/* va a la API (sin el
# prefijo) y el resto es la SPA, con fallback a index.html.
server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 10m;

  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # /_vercel/* (Analytics) solo existe en Vercel. Sin esto, el fallback a
  # index.html devuelve HTML como si fuera el script y el navegador falla con
  # "Unexpected token '<'".
  location /_vercel/ { return 404; }

  # El service worker y el manifest no se cachean: si no, una versión nueva
  # del portal tarda en llegar al navegador.
  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /push-sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
