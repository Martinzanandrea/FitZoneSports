name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  servidor:
    name: Servidor (tsc, pruebas y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos
        run: npx tsc --noEmit

      - name: Pruebas con informe de cobertura
        run: npm test -- --coverage

      - name: Compilar
        run: npm run build

      - name: Guardar informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-servidor
          path: backend/coverage
          if-no-files-found: ignore

  cliente:
    name: Cliente (tipos y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar (tsc y vite)
        run: npm run build
